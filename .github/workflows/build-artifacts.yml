name: Build Artifacts

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  schedule:
    - cron: "17 9 * * *"

env:
  CARGO_TERM_COLOR: always
  APP_NAME: CrystalBall

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            binary: CrystalBall
            archive: CrystalBall-linux-x86_64.tar.gz
          - name: macos
            os: macos-latest
            binary: CrystalBall
            archive: CrystalBall-macos-app.tar.gz
          - name: windows
            os: windows-latest
            binary: CrystalBall.exe
            archive: CrystalBall-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for nightly code changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet HEAD~1 HEAD -- src assets scripts Cargo.toml Cargo.lock .github/workflows; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux GUI dependencies
        if: steps.changes.outputs.should_build == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev

      - name: Build release binary
        if: steps.changes.outputs.should_build == 'true'
        run: cargo build --locked --release

      - name: Stage Linux artifact
        if: steps.changes.outputs.should_build == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/release/${{ matrix.binary }} dist/${{ matrix.name }}/
          cp README.md dist/${{ matrix.name }}/
          cat > dist/${{ matrix.name }}/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cp CrystalBall "$HOME/.local/bin/CrystalBall"
          chmod +x "$HOME/.local/bin/CrystalBall"
          echo "Installed CrystalBall to $HOME/.local/bin/CrystalBall"
          EOF
          chmod +x dist/${{ matrix.name }}/install.sh

      - name: Stage macOS app bundle
        if: steps.changes.outputs.should_build == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          scripts/package-macos.sh target/release/${{ matrix.binary }} dist/${{ matrix.name }}
          cp README.md dist/${{ matrix.name }}/
          cat > dist/${{ matrix.name }}/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          APP_NAME="CrystalBall.app"
          INSTALL_DIR="${1:-/Applications}"

          if [[ ! -d "$INSTALL_DIR" || ! -w "$INSTALL_DIR" ]]; then
            INSTALL_DIR="$HOME/Applications"
          fi

          mkdir -p "$INSTALL_DIR"
          rm -rf "$INSTALL_DIR/$APP_NAME"
          cp -R "$APP_NAME" "$INSTALL_DIR/"
          xattr -dr com.apple.quarantine "$INSTALL_DIR/$APP_NAME" 2>/dev/null || true

          echo "Installed CrystalBall to $INSTALL_DIR/$APP_NAME"
          EOF
          chmod +x dist/${{ matrix.name }}/install.sh

      - name: Stage Windows artifact
        if: steps.changes.outputs.should_build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.name }} | Out-Null
          Copy-Item target/release/${{ matrix.binary }} dist/${{ matrix.name }}/
          Copy-Item README.md dist/${{ matrix.name }}/
          @'
          $InstallDir = "$env:LOCALAPPDATA\CrystalBall"
          New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null
          Copy-Item ".\CrystalBall.exe" "$InstallDir\CrystalBall.exe" -Force
          Write-Host "Installed CrystalBall to $InstallDir\CrystalBall.exe"
          '@ | Set-Content -Path dist/${{ matrix.name }}/install.ps1

      - name: Package artifact
        if: steps.changes.outputs.should_build == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          tar -C dist/${{ matrix.name }} -czf dist/${{ matrix.archive }} .

      - name: Package artifact
        if: steps.changes.outputs.should_build == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/${{ matrix.name }}/* -DestinationPath dist/${{ matrix.archive }}

      - name: Upload downloadable build
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

      - name: Attach artifacts to GitHub release
        if: steps.changes.outputs.should_build == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
